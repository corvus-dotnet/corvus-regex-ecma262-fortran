# The Industry benchmark harness for this binding (see app/industry.f90).
name = "industry"
version = "0.2.5"

[build]
link = ["corvus_regex_ecma262"]
auto-executables = false

[fortran]
implicit-typing = false
implicit-external = false

[dependencies]
corvus-regex-ecma262 = { path = "../.." }
jsonlite = { path = "../jsonlite" }
# fortran-regex 1.1.2, pinned to the commit of its tag so that the tag cannot move under the harness.
fortran-regex = { git = "https://github.com/perazz/fortran-regex", rev = "83a409ca9443990759395731732733ded013e1f3" }

[[executable]]
name = "industry"
source-dir = "app"
main = "industry.f90"
