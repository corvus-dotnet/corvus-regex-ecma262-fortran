# The ECMA-262 test-data runner for this binding: `fpm run -- <data directory> <wrong-cases file>`, from here.
name = "dataset"
version = "0.1.3"

[build]
link = ["corvus_regex_ecma262"]
auto-executables = false

[fortran]
implicit-typing = false
implicit-external = false

[dependencies]
corvus-regex-ecma262 = { path = "../.." }
jsonlite = { path = "../jsonlite" }

[[executable]]
name = "dataset"
source-dir = "app"
main = "dataset.f90"
